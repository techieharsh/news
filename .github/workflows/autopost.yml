name: 24/7 News Auto-Sync to Blogger

on:
  schedule:
    # Runs every 2 hours (UTC)
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write # Needed to commit posted_history.json back to repo

jobs:
  sync-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Auto-Publisher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOGGER_EMAIL: ${{ secrets.BLOGGER_EMAIL }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
        run: |
          python autopost.py

      - name: Commit & Push Updated History
        run: |
          git config --global user.name "DainikSaar-Bot"
          git config --global user.email "bot@dainiksaar.blogspot.com"
          git add posted_history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update posted articles history [skip ci]" && git push)
